databases:
  - name: household-expenses-db
    plan: free
    databaseName: household_expenses
    user: household_expenses

services:
  - type: web
    name: household-expenses-api
    runtime: docker
    plan: free
    dockerfilePath: ./server/Dockerfile
    dockerContext: ./server
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: household-expenses-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: "*"
      - key: PORT
        value: "4000"
